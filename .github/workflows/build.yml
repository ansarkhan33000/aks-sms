        EOF

        cat << 'EOF' > app/src/main/java/com/aks/cnic/MainActivity.kt
        package com.aks.cnic

        import android.Manifest
        import android.content.*
        import android.content.pm.PackageManager
        import android.media.AudioManager
        import android.media.ToneGenerator
        import android.net.Uri
        import android.os.*
        import android.telephony.SmsManager
        import android.telephony.SubscriptionManager
        import android.telephony.TelephonyManager
        import android.view.SoundEffectConstants
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat

        class MainActivity : AppCompatActivity() {

          private lateinit var tvStatus: TextView
          private lateinit var tvSentMsg: TextView
          private lateinit var tvLog: TextView
          private lateinit var etCounter: EditText
          private lateinit var prefs: SharedPreferences
          private var lastFormattedMsg = ""
          private var toneGen: ToneGenerator? = null

          override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            setContentView(R.layout.activity_main)

            try {
              toneGen = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 95)
            } catch (_: Exception) {}

            prefs = getSharedPreferences("AKS_CNIC_PREFS", Context.MODE_PRIVATE)
            val rbSim1 = findViewById<RadioButton>(R.id.rbSim1)
            val btnStart = findViewById<Button>(R.id.btnStart)
            val btnSaveCounter = findViewById<Button>(R.id.btnSaveCounter)
            val btnCopy = findViewById<Button>(R.id.btnCopy)
            val btnWhatsApp = findViewById<Button>(R.id.btnWhatsApp)
            etCounter = findViewById(R.id.etCounter)
            tvStatus = findViewById(R.id.tvStatus)
            tvSentMsg = findViewById(R.id.tvSentMsg)
            tvLog = findViewById(R.id.tvLog)

            val savedNum = prefs.getInt("kma_counter", 9801).coerceAtLeast(9801)
            etCounter.setText(savedNum.toString())

            checkPermissions()

            btnSaveCounter.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              val entered = etCounter.text.toString().toIntOrNull()
              if (entered == null || entered < 9801) {
                playErrorSound()
                Toast.makeText(this, "Number must be 9801 or higher", Toast.LENGTH_SHORT).show()
                etCounter.setText(prefs.getInt("kma_counter", 9801).toString())
              } else {
                prefs.edit().putInt("kma_counter", entered).apply()
                playSuccessSound()
                Toast.makeText(this, "Next code saved: KMA$entered", Toast.LENGTH_SHORT).show()
              }
            }

            btnStart.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              playStartSound()
              if (!checkPermissions()) return@setOnClickListener
              val simSlot = if (rbSim1.isChecked) 0 else 1
              dialAndProcess("*336*1*2#", simSlot)
            }

            btnCopy.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              if (lastFormattedMsg.isNotEmpty()) {
                copyToClipboard(lastFormattedMsg)
                playSuccessSound()
              } else {
                playErrorSound()
                Toast.makeText(this, "Nothing sent yet", Toast.LENGTH_SHORT).show()
              }
            }

            btnWhatsApp.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              playStartSound()
              try {
                startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/923333997576")))
              } catch (e: Exception) {
                Toast.makeText(this, "WhatsApp: 03333997576", Toast.LENGTH_LONG).show()
              }
            }
          }

          private fun dialAndProcess(ussdCode: String, simSlot: Int) {
            try {
              if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED ||
                  ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED ||
                  ActivityCompat.checkSelfPermission(this, Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) {
                checkPermissions()
                return
              }

              tvStatus.text = "Status: Dialing $ussdCode ..."
              val subId = getSubIdForSlot(simSlot)
              val baseManager = getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
              val telephonyManager = baseManager.createForSubscriptionId(subId)

              telephonyManager.sendUssdRequest(
                ussdCode,
                object : TelephonyManager.UssdResponseCallback() {
                  override fun onReceiveUssdResponse(tm: TelephonyManager, request: String, response: CharSequence) {
                    val reply = response.toString()
                    val cleanDigits = reply.replace("-", "")
                    val match = Regex("\\b\\d{13}\\b").find(cleanDigits)

                    if (match != null) {
                      val cnic = match.value
                      copyToClipboard(cnic)

                      val currentNum = prefs.getInt("kma_counter", 9801).coerceAtLeast(9801)
                      val smsBody = "REG $cnic KMA$currentNum S 03102018"

                      val nextNum = currentNum + 1
                      prefs.edit().putInt("kma_counter", nextNum).apply()
                      etCounter.setText(nextNum.toString())

                      sendSmsTo9771(smsBody, subId)
                      lastFormattedMsg = smsBody
                      tvSentMsg.text = "Sent to 9771:\n$smsBody"
                      tvStatus.text = "Status: Sent KMA$currentNum! Next: KMA$nextNum"
                      tvLog.append("OK -> $smsBody\n")
                      playSuccessSound()
                    } else {
                      playErrorSound()
                      tvStatus.text = "Status: CNIC not found in USSD reply"
                      tvLog.append("Reply: $reply\n")
                    }
                  }

                  override fun onReceiveUssdResponseFailed(tm: TelephonyManager, request: String, failureCode: Int) {
                    playErrorSound()
                    tvStatus.text = "Status: USSD Failed (Code: $failureCode)"
                  }
                },
                Handler(Looper.getMainLooper())
              )
            } catch (e: Exception) {
              playErrorSound()
              tvStatus.text = "Error: ${e.message}"
            }
          }

          private fun sendSmsTo9771(message: String, subId: Int) {
            val smsManager = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
              getSystemService(SmsManager::class.java).createForSubscriptionId(subId)
            } else {
              @Suppress("DEPRECATION")
              SmsManager.getSmsManagerForSubscriptionId(subId)
            }
            smsManager.sendTextMessage("9771", null, message, null, null)
          }

          private fun getSubIdForSlot(simSlot: Int): Int {
            if (ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED) {
              val subManager = getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE) as SubscriptionManager
              val subList = subManager.activeSubscriptionInfoList
              if (!subList.isNullOrEmpty() && simSlot < subList.size) {
                return subList[simSlot].subscriptionId
              }
            }
            return SubscriptionManager.getDefaultSubscriptionId()
          }

          private fun copyToClipboard(text: String) {
            val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
            clipboard.setPrimaryClip(ClipData.newPlainText("CNIC_DATA", text))
            Toast.makeText(this, "Copied: $text", Toast.LENGTH_SHORT).show()
          }

          private fun playStartSound() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_BEEP, 150) } catch (_: Exception) {}
          }

          private fun playSuccessSound() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_ACK, 300) } catch (_: Exception) {}
          }

          private fun playErrorSound() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_NACK, 350) } catch (_: Exception) {}
          }

          private fun checkPermissions(): Boolean {
            val perms = arrayOf(
              Manifest.permission.CALL_PHONE,
              Manifest.permission.SEND_SMS,
              Manifest.permission.READ_PHONE_STATE
            )
            val needed = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
            return if (needed.isNotEmpty()) {
              ActivityCompat.requestPermissions(this, needed.toTypedArray(), 104)
              false
            } else true
          }

          override fun onDestroy() {
            super.onDestroy()
            toneGen?.release()
          }
        }
        EOF

        sed -i 's/^        //' settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/res/drawable/bg_3d_header.xml app/src/main/res/drawable/bg_3d_card.xml app/src/main/res/drawable/bg_3d_btn_start.xml app/src/main/res/drawable/bg_3d_btn_whatsapp.xml app/src/main/res/drawable/ic_aks_logo.xml app/src/main/AndroidManifest.xml app/src/main/res/layout/activity_main.xml app/src/main/java/com/aks/cnic/MainActivity.kt

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AKS-CNIC-3D-APK
        path: app/build/outputs/apk/debug/app-debug.apk
