name: Build AKS Call Center APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate AKS Call Center Project
      run: |
        mkdir -p app/src/main/java/com/aks/callcenter app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories { google(); mavenCentral() }
        }
        rootProject.name = "AKS_Call_Center"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
          id("com.android.application") version "8.2.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
        }
        android {
          namespace = "com.aks.callcenter"
          compileSdk = 34
          defaultConfig {
            applicationId = "com.aks.callcenter"
            minSdk = 24
            targetSdk = 34
            versionCode = 1
            versionName = "1.0"
          }
          buildTypes {
            release { isMinifyEnabled = false }
          }
          compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
          implementation("androidx.core:core-ktx:1.12.0")
          implementation("androidx.appcompat:appcompat:1.6.1")
          implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
          <string name="app_name">AKS Call Center</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
          <solid android:color="#121B26" />
          <corners android:radius="14dp" />
          <stroke android:width="1.5dp" android:color="#00BFA5" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_green_btn.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="4dp">
            <shape android:shape="rectangle">
              <solid android:color="#004D40" />
              <corners android:radius="12dp" />
            </shape>
          </item>
          <item android:bottom="4dp">
            <shape android:shape="rectangle">
              <gradient android:startColor="#00C853" android:endColor="#00897B" android:angle="270" />
              <corners android:radius="12dp" />
              <stroke android:width="1dp" android:color="#69F0AE" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_aks_call.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
          android:width="108dp"
          android:height="108dp"
          android:viewportWidth="108"
          android:viewportHeight="108">
          <path android:fillColor="#004D40" android:pathData="M14,8 L94,8 Q102,8 102,16 L102,92 Q102,100 94,100 L14,100 Q6,100 6,92 L6,16 Q6,8 14,8 Z" />
          <path android:fillColor="#00E676" android:pathData="M36,30 L48,30 L52,44 L44,50 Q50,62 62,68 L68,60 L82,64 L82,76 Q62,82 42,62 Q24,42 36,30 Z" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.CALL_PHONE" />
          <uses-permission android:name="android.permission.READ_PHONE_STATE" />
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          <application
            android:allowBackup="true"
            android:icon="@drawable/ic_aks_call"
            android:roundIcon="@drawable/ic_aks_call"
            android:label="@string/app_name"
            android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
            <activity
              android:name=".MainActivity"
              android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
            </activity>
          </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
          android:layout_width="match_parent"
          android:layout_height="match_parent"
          android:orientation="vertical"
          android:background="#090F17">

          <!-- Running WhatsApp Contact Strip -->
          <TextView
            android:id="@+id/tvContactTicker"
            android:layout_width="match_parent"
            android:layout_height="34dp"
            android:background="#1B5E20"
            android:textColor="#FFFFFF"
            android:textSize="13sp"
            android:textStyle="bold"
            android:gravity="center_vertical"
            android:singleLine="true"
            android:ellipsize="marquee"
            android:marqueeRepeatLimit="marquee_forever"
            android:focusable="true"
            android:focusableInTouchMode="true"
            android:scrollHorizontally="true"
            android:paddingStart="10dp"
            android:paddingEnd="10dp"
            android:text="   Contact Now WhatsApp: 03333997576   |   AKS CALL CENTER - Auto Voice &amp; Dialer   |   Contact Now: 03333997576   " />

          <ScrollView
            android:layout_width="match_parent"
            android:layout_height="match_parent">

            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="14dp">

              <TextView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="AKS CALL CENTER PRO"
                android:textColor="#00E676"
                android:textSize="22sp"
                android:textStyle="bold"
                android:gravity="center"
                android:paddingBottom="10dp" />

              <!-- Step 1: Voice Recording Setup -->
              <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="@drawable/bg_3d_card"
                android:padding="14dp"
                android:layout_marginBottom="12dp">

                <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="1. Auto Voice Recording (MP3 / WAV)"
                  android:textColor="#69F0AE"
                  android:textStyle="bold"
                  android:textSize="15sp" />

                <TextView
                  android:id="@+id/tvSelectedAudio"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="No Recording Selected"
                  android:textColor="#B0BEC5"
                  android:textSize="13sp"
                  android:paddingTop="6dp"
                  android:paddingBottom="8dp" />

                <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <Button
                    android:id="@+id/btnPickAudio"
                    android:layout_width="0dp"
                    android:layout_height="44dp"
                    android:layout_weight="1"
                    android:text="Select Recording"
                    android:backgroundTint="#1976D2"
                    android:textColor="#FFFFFF"
                    android:layout_marginEnd="6dp" />

                  <Button
                    android:id="@+id/btnTestAudio"
                    android:layout_width="wrap_content"
                    android:layout_height="44dp"
                    android:text="Test Play"
                    android:backgroundTint="#00796B"
                    android:textColor="#FFFFFF" />
                </LinearLayout>

                <CheckBox
                  android:id="@+id/cbAutoPlay"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Auto-Play Recording When Call Connects"
                  android:textColor="#FFFFFF"
                  android:checked="true"
                  android:layout_marginTop="4dp" />
              </LinearLayout>

              <!-- Step 2: Customer Numbers & Delay -->
              <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="@drawable/bg_3d_card"
                android:padding="14dp"
                android:layout_marginBottom="12dp">

                <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="2. Customer Numbers List (1 per line)"
                  android:textColor="#69F0AE"
                  android:textStyle="bold"
                  android:textSize="15sp"
                  android:paddingBottom="6dp" />

                <EditText
                  android:id="@+id/etNumbers"
                  android:layout_width="match_parent"
                  android:layout_height="130dp"
                  android:background="#1C2833"
                  android:textColor="#FFFFFF"
                  android:hint="03001234567&#10;03333997576"
                  android:textColorHint="#78909C"
                  android:gravity="top|start"
                  android:padding="10dp"
                  android:inputType="textMultiLine"
                  android:textSize="14sp" />

                <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:layout_marginTop="8dp">

                  <TextView
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:text="Gap Between Calls (Seconds):"
                    android:textColor="#FFFFFF"
                    android:textSize="13sp" />

                  <EditText
                    android:id="@+id/etDelay"
                    android:layout_width="70dp"
                    android:layout_height="40dp"
                    android:background="#1C2833"
                    android:textColor="#00E676"
                    android:text="25"
                    android:gravity="center"
                    android:inputType="number" />
                </LinearLayout>
              </LinearLayout>

              <!-- Step 3: Live Status & Action Buttons -->
              <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="@drawable/bg_3d_card"
                android:padding="14dp">

                <TextView
                  android:id="@+id/tvLiveStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Status: Ready"
                  android:textColor="#FFD54F"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:gravity="center"
                  android:paddingBottom="10dp" />

                <androidx.appcompat.widget.AppCompatButton
                  android:id="@+id/btnStartCalls"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:background="@drawable/bg_3d_green_btn"
                  android:text="START AUTO CALLS + VOICE"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:textStyle="bold" />

                <Button
                  android:id="@+id/btnStopAll"
                  android:layout_width="match_parent"
                  android:layout_height="44dp"
                  android:layout_marginTop="8dp"
                  android:backgroundTint="#C62828"
                  android:text="STOP CALLS &amp; VOICE"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold" />
              </LinearLayout>

            </LinearLayout>
          </ScrollView>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/aks/callcenter/MainActivity.kt
        package com.aks.callcenter

        import android.Manifest
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.media.AudioManager
        import android.media.MediaPlayer
        import android.net.Uri
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.widget.*
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat

        class MainActivity : AppCompatActivity() {

          private var audioUri: Uri? = null
          private var mediaPlayer: MediaPlayer? = null
          private val handler = Handler(Looper.getMainLooper())
          private var numberQueue = listOf<String>()
          private var currentIndex = 0
          private var isRunning = false

          private lateinit var tvSelectedAudio: TextView
          private lateinit var tvLiveStatus: TextView
          private lateinit var etNumbers: EditText
          private lateinit var etDelay: EditText
          private lateinit var cbAutoPlay: CheckBox

          private val pickAudioLauncher = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
            if (uri != null) {
              try {
                contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
              } catch (_: Exception) {}
              audioUri = uri
              tvSelectedAudio.text = "Selected: ${uri.lastPathSegment ?: "Voice Recording"}"
              Toast.makeText(this, "Recording Loaded!", Toast.LENGTH_SHORT).show()
            }
          }

          override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            setContentView(R.layout.activity_main)

            val tvContactTicker = findViewById<TextView>(R.id.tvContactTicker)
            tvContactTicker.isSelected = true
            tvContactTicker.setOnClickListener {
              try {
                startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/923333997576")))
              } catch (_: Exception) {}
            }

            tvSelectedAudio = findViewById(R.id.tvSelectedAudio)
            tvLiveStatus = findViewById(R.id.tvLiveStatus)
            etNumbers = findViewById(R.id.etNumbers)
            etDelay = findViewById(R.id.etDelay)
            cbAutoPlay = findViewById(R.id.cbAutoPlay)

            requestCallPermission()

            findViewById<Button>(R.id.btnPickAudio).setOnClickListener {
              pickAudioLauncher.launch(arrayOf("audio/*"))
            }

            findViewById<Button>(R.id.btnTestAudio).setOnClickListener {
              playRecording()
            }

            findViewById<Button>(R.id.btnStartCalls).setOnClickListener {
              startAutoCampaign()
            }

            findViewById<Button>(R.id.btnStopAll).setOnClickListener {
              stopEverything()
            }
          }

          private fun requestCallPermission() {
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED) {
              ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CALL_PHONE, Manifest.permission.MODIFY_AUDIO_SETTINGS), 101)
            }
          }

          private fun startAutoCampaign() {
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED) {
              requestCallPermission()
              Toast.makeText(this, "Please Allow Phone Call Permission First!", Toast.LENGTH_SHORT).show()
              return
            }

            val raw = etNumbers.text.toString().lines().map { it.trim() }.filter { it.isNotEmpty() }
            if (raw.isEmpty()) {
              Toast.makeText(this, "Enter at least 1 phone number!", Toast.LENGTH_SHORT).show()
              return
            }

            numberQueue = raw
            currentIndex = 0
            isRunning = true
            dialNextNumber()
          }

          private fun dialNextNumber() {
            if (!isRunning) return
            if (currentIndex >= numberQueue.size) {
              isRunning = false
              tvLiveStatus.text = "Status: All ${numberQueue.size} Calls Completed!"
              Toast.makeText(this, "All Calls Completed!", Toast.LENGTH_LONG).show()
              return
            }

            val targetNum = numberQueue[currentIndex]
            tvLiveStatus.text = "Calling (${currentIndex + 1}/${numberQueue.size}): $targetNum"

            try {
              val callIntent = Intent(Intent.ACTION_CALL, Uri.parse("tel:$targetNum"))
              startActivity(callIntent)
            } catch (e: Exception) {
              Toast.makeText(this, "Call Error: ${e.message}", Toast.LENGTH_SHORT).show()
            }

            // Enable Speaker & Auto-Play Recording after 4 seconds so ring/answer connects
            if (cbAutoPlay.isChecked && audioUri != null) {
              handler.postDelayed({
                if (isRunning) {
                  enableLoudspeaker()
                  playRecording()
                }
              }, 4000L)
            }

            val gapSec = etDelay.text.toString().toLongOrNull() ?: 25L
            currentIndex++
            handler.postDelayed({
              dialNextNumber()
            }, gapSec * 1000L)
          }

          private fun enableLoudspeaker() {
            try {
              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
              am.mode = AudioManager.MODE_IN_CALL
              am.isSpeakerphoneOn = true
            } catch (_: Exception) {}
          }

          private fun playRecording() {
            val uri = audioUri ?: run {
              Toast.makeText(this, "Select an Audio Recording First!", Toast.LENGTH_SHORT).show()
              return
            }
            try {
              mediaPlayer?.release()
              mediaPlayer = MediaPlayer().apply {
                setDataSource(applicationContext, uri)
                prepare()
                start()
              }
            } catch (e: Exception) {
              Toast.makeText(this, "Audio Play Error: ${e.message}", Toast.LENGTH_SHORT).show()
            }
          }

          private fun stopEverything() {
            isRunning = false
            handler.removeCallbacksAndMessages(null)
            try {
              mediaPlayer?.stop()
              mediaPlayer?.release()
              mediaPlayer = null
            } catch (_: Exception) {}
            tvLiveStatus.text = "Status: Stopped"
          }

          override fun onDestroy() {
            super.onDestroy()
            stopEverything()
          }
        }
        EOF

        sed -i 's/^        //' settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/res/values/strings.xml app/src/main/res/drawable/bg_3d_card.xml app/src/main/res/drawable/bg_3d_green_btn.xml app/src/main/res/drawable/ic_aks_call.xml app/src/main/AndroidManifest.xml app/src/main/res/layout/activity_main.xml app/src/main/java/com/aks/callcenter/MainActivity.kt

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AKS-Call-Center-APK
        path: app/build/outputs/apk/debug/app-debug.apk
