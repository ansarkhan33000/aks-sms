        cat << 'EOF' > app/src/main/java/com/aks/call/UssdReaderService.kt
        package com.aks.call

        import android.accessibilityservice.AccessibilityService
        import android.content.*
        import android.media.AudioManager
        import android.media.ToneGenerator
        import android.net.Uri
        import android.os.Build
        import android.provider.Telephony
        import android.telephony.SmsManager
        import android.telephony.SubscriptionManager
        import android.view.accessibility.AccessibilityEvent
        import android.view.accessibility.AccessibilityNodeInfo
        import android.widget.Toast
        import java.text.SimpleDateFormat
        import java.util.*

        class UssdReaderService : AccessibilityService() {

          override fun onAccessibilityEvent(event: AccessibilityEvent?) {
            val prefs = getSharedPreferences("AKS_CALL_PREFS", Context.MODE_PRIVATE)
            val isWaiting = prefs.getBoolean("waiting_for_ussd", false)
            if (!isWaiting) return

            val rootNode = rootInActiveWindow ?: return
            val allText = StringBuilder()
            collectText(rootNode, allText)
            val screenText = allText.toString()

            val cleanDigits = screenText.replace("-", "")
            val match = Regex("\\b\\d{13}\\b").find(cleanDigits)

            if (match != null) {
              val cnic = match.value
              prefs.edit().putBoolean("waiting_for_ussd", false).apply()

              // Copy CNIC to clipboard
              val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              clipboard.setPrimaryClip(ClipData.newPlainText("CNIC", cnic))

              // Close USSD popup dialog automatically
              clickDismissButton(rootNode)

              // Format SMS & increment KMA code
              val currentCode = prefs.getInt("kma_code", 9801)
              val format = prefs.getString("sms_format", "REG {CNIC} KMA{CODE} S 03102018") ?: "REG {CNIC} KMA{CODE} S 03102018"
              val recipient = prefs.getString("recipient_num", "9771") ?: "9771"
              val simSlot = prefs.getInt("selected_sim", 0)

              val finalSms = format
                .replace("{CNIC}", cnic)
                .replace("{CODE}", currentCode.toString())

              val nextCode = currentCode + 1
              val timeStr = SimpleDateFormat("dd-MM HH:mm:ss", Locale.getDefault()).format(Date())
              val newEntry = "[$timeStr] SIM${simSlot + 1} | KMA$currentCode\nCNIC: $cnic\nMsg ($recipient): $finalSms\n-------------------------\n"
              val oldReport = prefs.getString("full_report", "") ?: ""

              prefs.edit()
                .putInt("kma_code", nextCode)
                .putString("last_captured", "CNIC: $cnic -> $finalSms")
                .putString("full_report", newEntry + oldReport)
                .apply()

              try {
                ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100).startTone(ToneGenerator.TONE_PROP_ACK, 350)
              } catch (_: Exception) {}

              Toast.makeText(this, "CNIC Copied: $cnic", Toast.LENGTH_SHORT).show()

              // Try direct SMS send and also open New Message composer with pre-filled text
              sendDirectSms(recipient, finalSms, simSlot)
              openSmsComposer(recipient, finalSms)
            }
          }

          private fun collectText(node: AccessibilityNodeInfo?, sb: StringBuilder) {
            if (node == null) return
            if (node.text != null) {
              sb.append(node.text).append(" ")
            }
            for (i in 0 until node.childCount) {
              collectText(node.getChild(i), sb)
            }
          }

          private fun clickDismissButton(node: AccessibilityNodeInfo?) {
            if (node == null) return
            val labels = listOf("OK", "Cancel", "Dismiss", "Close", "ٹھیک ہے")
            for (label in labels) {
              val nodes = node.findAccessibilityNodeInfosByText(label)
              for (n in nodes) {
                if (n.isClickable) {
                  n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                  return
                }
              }
            }
          }

          private fun sendDirectSms(recipient: String, message: String, simSlot: Int) {
            try {
              val subManager = getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE) as SubscriptionManager
              val subList = subManager.activeSubscriptionInfoList
              val subId = if (!subList.isNullOrEmpty() && simSlot < subList.size) {
                subList[simSlot].subscriptionId
              } else {
                SubscriptionManager.getDefaultSmsSubscriptionId()
              }
              val smsManager = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                getSystemService(SmsManager::class.java).createForSubscriptionId(subId)
              } else {
                @Suppress("DEPRECATION")
                SmsManager.getSmsManagerForSubscriptionId(subId)
              }
              smsManager.sendTextMessage(recipient, null, message, null, null)
            } catch (_: Exception) {}
          }

          private fun openSmsComposer(recipient: String, message: String) {
            try {
              val defaultSmsPkg = Telephony.Sms.getDefaultSmsPackage(this)
              val intent = Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:$recipient")).apply {
                putExtra("sms_body", message)
                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                if (defaultSmsPkg != null) setPackage(defaultSmsPkg)
              }
              startActivity(intent)
            } catch (_: Exception) {}
          }

          override fun onInterrupt() {}
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/aks/call/MainActivity.kt
        package com.aks.call

        import android.Manifest
        import android.content.*
        import android.content.pm.PackageManager
        import android.media.AudioManager
        import android.media.ToneGenerator
        import android.net.Uri
        import android.os.Bundle
        import android.provider.Settings
        import android.telecom.PhoneAccountHandle
        import android.telecom.TelecomManager
        import android.text.TextUtils
        import android.view.SoundEffectConstants
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat

        class MainActivity : AppCompatActivity() {

          private lateinit var tvServiceStatus: TextView
          private lateinit var tvLastAction: TextView
          private lateinit var tvReport: TextView
          private lateinit var etKmaCode: EditText
          private lateinit var etFormat: EditText
          private lateinit var etRecipient: EditText
          private lateinit var prefs: SharedPreferences
          private var toneGen: ToneGenerator? = null

          override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            setContentView(R.layout.activity_main)

            try {
              toneGen = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 95)
            } catch (_: Exception) {}

            prefs = getSharedPreferences("AKS_CALL_PREFS", Context.MODE_PRIVATE)
            val rbSim1 = findViewById<RadioButton>(R.id.rbSim1)
            val btnEnableService = findViewById<Button>(R.id.btnEnableService)
            val btnSaveSettings = findViewById<Button>(R.id.btnSaveSettings)
            val btnStart = findViewById<Button>(R.id.btnStart)
            val btnCopyReport = findViewById<Button>(R.id.btnCopyReport)
            val btnWhatsApp = findViewById<Button>(R.id.btnWhatsApp)

            tvServiceStatus = findViewById(R.id.tvServiceStatus)
            tvLastAction = findViewById(R.id.tvLastAction)
            tvReport = findViewById(R.id.tvReport)
            etKmaCode = findViewById(R.id.etKmaCode)
            etFormat = findViewById(R.id.etFormat)
            etRecipient = findViewById(R.id.etRecipient)

            checkPermissions()

            btnEnableService.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              playBeep()
              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
              Toast.makeText(this, "Find 'AKS Call' and Turn ON", Toast.LENGTH_LONG).show()
            }

            btnSaveSettings.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              val code = etKmaCode.text.toString().toIntOrNull() ?: 9801
              val fmt = etFormat.text.toString().trim().ifEmpty { "REG {CNIC} KMA{CODE} S 03102018" }
              val rec = etRecipient.text.toString().trim().ifEmpty { "9771" }
              prefs.edit()
                .putInt("kma_code", code)
                .putString("sms_format", fmt)
                .putString("recipient_num", rec)
                .apply()
              playAck()
              Toast.makeText(this, "Saved! Next: KMA$code -> $rec", Toast.LENGTH_SHORT).show()
            }

            btnStart.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              playBeep()
              if (!checkPermissions()) return@setOnClickListener

              if (!isAccessibilityEnabled()) {
                Toast.makeText(this, "Please Enable 'AKS Call Screen Reader' first!", Toast.LENGTH_LONG).show()
                startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                return@setOnClickListener
              }

              val simSlot = if (rbSim1.isChecked) 0 else 1
              val code = etKmaCode.text.toString().toIntOrNull() ?: prefs.getInt("kma_code", 9801)
              val fmt = etFormat.text.toString().trim().ifEmpty { "REG {CNIC} KMA{CODE} S 03102018" }
              val rec = etRecipient.text.toString().trim().ifEmpty { "9771" }

              prefs.edit()
                .putBoolean("waiting_for_ussd", true)
                .putInt("selected_sim", simSlot)
                .putInt("kma_code", code)
                .putString("sms_format", fmt)
                .putString("recipient_num", rec)
                .apply()

              dialUssdInDialer("*336*1*2#", simSlot)
            }

            btnCopyReport.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              clipboard.setPrimaryClip(ClipData.newPlainText("AKS_REPORT", tvReport.text.toString()))
              playAck()
              Toast.makeText(this, "Report Copied!", Toast.LENGTH_SHORT).show()
            }

            btnWhatsApp.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              playBeep()
              try {
                startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/923333997576")))
              } catch (e: Exception) {
                Toast.makeText(this, "WhatsApp: 03333997576", Toast.LENGTH_LONG).show()
              }
            }
          }

          override fun onResume() {
            super.onResume()
            refreshUi()
          }

          private fun refreshUi() {
            val active = isAccessibilityEnabled()
            if (active) {
              tvServiceStatus.text = "Auto Reader Service: ON (Ready to Work)"
              tvServiceStatus.setTextColor(0xFF1B5E20.toInt())
            } else {
              tvServiceStatus.text = "Auto Reader Service: OFF (Tap button below to ON)"
              tvServiceStatus.setTextColor(0xFFC62828.toInt())
            }

            etKmaCode.setText(prefs.getInt("kma_code", 9801).toString())
            etFormat.setText(prefs.getString("sms_format", "REG {CNIC} KMA{CODE} S 03102018"))
            etRecipient.setText(prefs.getString("recipient_num", "9771"))
            tvLastAction.text = "Last Captured:\n" + (prefs.getString("last_captured", "None yet") ?: "None yet")
            val rep = prefs.getString("full_report", "") ?: ""
            if (rep.isNotEmpty()) tvReport.text = rep
          }

          private fun dialUssdInDialer(ussd: String, simSlot: Int) {
            try {
              if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED ||
                  ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED) {
                checkPermissions()
                return
              }

              val encodedUssd = ussd.replace("#", Uri.encode("#"))
              val callIntent = Intent(Intent.ACTION_CALL, Uri.parse("tel:$encodedUssd"))

              val telecomManager = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
              val accounts: List<PhoneAccountHandle> = telecomManager.callCapablePhoneAccounts
              if (accounts.isNotEmpty() && simSlot < accounts.size) {
                callIntent.putExtra(TelecomManager.EXTRA_PHONE_ACCOUNT_HANDLE, accounts[simSlot])
              }

              startActivity(callIntent)
            } catch (e: Exception) {
              Toast.makeText(this, "Dial Error: ${e.message}", Toast.LENGTH_LONG).show()
            }
          }

          private fun isAccessibilityEnabled(): Boolean {
            val expectedComponent = ComponentName(this, UssdReaderService::class.java).flattenToString()
            val enabledServices = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
            val splitter = TextUtils.SimpleStringSplitter(':')
            splitter.setString(enabledServices)
            while (splitter.hasNext()) {
              if (splitter.next().equals(expectedComponent, ignoreCase = true)) return true
            }
            return false
          }

          private fun checkPermissions(): Boolean {
            val perms = arrayOf(
              Manifest.permission.CALL_PHONE,
              Manifest.permission.READ_PHONE_STATE,
              Manifest.permission.SEND_SMS
            )
            val needed = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
            return if (needed.isNotEmpty()) {
              ActivityCompat.requestPermissions(this, needed.toTypedArray(), 106)
              false
            } else true
          }

          private fun playBeep() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_BEEP, 150) } catch (_: Exception) {}
          }

          private fun playAck() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_ACK, 300) } catch (_: Exception) {}
          }

          override fun onDestroy() {
            super.onDestroy()
            toneGen?.release()
          }
        }
        EOF

        sed -i 's/^        //' settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/res/xml/accessibility_service_config.xml app/src/main/res/drawable/bg_3d_header.xml app/src/main/res/drawable/bg_3d_card.xml app/src/main/res/drawable/bg_3d_btn_start.xml app/src/main/res/drawable/bg_3d_btn_perm.xml app/src/main/res/drawable/bg_3d_btn_whatsapp.xml app/src/main/res/drawable/ic_aks_call_logo.xml app/src/main/AndroidManifest.xml app/src/main/res/layout/activity_main.xml app/src/main/java/com/aks/call/UssdReaderService.kt app/src/main/java/com/aks/call/MainActivity.kt

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AKS-Call-3D-APK
        path: app/build/outputs/apk/debug/app-debug.apk
