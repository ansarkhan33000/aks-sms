name: Build AKS ONLINE 100 Mobiles APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate AKS ONLINE 100 Project
      run: |
        mkdir -p app/src/main/java/com/aks/online100 app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories { google(); mavenCentral() }
        }
        rootProject.name = "AKS_ONLINE"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
          id("com.android.application") version "8.2.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
        }
        android {
          namespace = "com.aks.online100"
          compileSdk = 34
          defaultConfig {
            applicationId = "com.aks.online100"
            minSdk = 28
            targetSdk = 34
            versionCode = 1
            versionName = "1.0"
          }
          buildTypes {
            release { isMinifyEnabled = false }
          }
          compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
          implementation("androidx.core:core-ktx:1.12.0")
          implementation("androidx.appcompat:appcompat:1.6.1")
          implementation("com.google.android.material:material:1.11.0")
          implementation("androidx.webkit:webkit:1.10.0")
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
          <string name="app_name">AKS ONLINE</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_phone_frame.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
          <solid android:color="#101820" />
          <corners android:radius="12dp" />
          <stroke android:width="2dp" android:color="#00BFA5" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_btn.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="3dp">
            <shape android:shape="rectangle">
              <solid android:color="#00251A" />
              <corners android:radius="10dp" />
            </shape>
          </item>
          <item android:bottom="3dp">
            <shape android:shape="rectangle">
              <gradient android:startColor="#00BFA5" android:endColor="#00695C" android:angle="270" />
              <corners android:radius="10dp" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_aks_online.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
          android:width="108dp"
          android:height="108dp"
          android:viewportWidth="108"
          android:viewportHeight="108">
          <path android:fillColor="#00251A" android:pathData="M14,14 L94,14 Q102,14 102,22 L102,94 Q102,102 94,102 L14,102 Q6,102 6,94 L6,22 Q6,14 14,14 Z" />
          <path android:fillColor="#00695C" android:pathData="M14,8 L94,8 Q102,8 102,16 L102,88 Q102,96 94,96 L14,96 Q6,96 6,88 L6,16 Q6,8 14,8 Z" />
          <path android:fillColor="#FFD54F" android:pathData="M54,24 A28,28 0 1,0 54,80 A28,28 0 1,0 54,24 Z" />
          <path android:fillColor="#004D40" android:pathData="M46,38 L70,52 L46,66 Z" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          <application
            android:allowBackup="true"
            android:hardwareAccelerated="true"
            android:icon="@drawable/ic_aks_online"
            android:roundIcon="@drawable/ic_aks_online"
            android:label="@string/app_name"
            android:usesCleartextTraffic="true"
            android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
            <activity
              android:name=".MainActivity"
              android:configChanges="orientation|screenSize|keyboardHidden"
              android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
            </activity>
          </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
          android:layout_width="match_parent"
          android:layout_height="match_parent"
          android:orientation="vertical"
          android:background="#0B131E">

          <!-- Running Contact Strip (Marquee) -->
          <TextView
            android:id="@+id/tvContactTicker"
            android:layout_width="match_parent"
            android:layout_height="32dp"
            android:background="#1B5E20"
            android:textColor="#FFFFFF"
            android:textSize="13sp"
            android:textStyle="bold"
            android:gravity="center_vertical"
            android:singleLine="true"
            android:ellipsize="marquee"
            android:marqueeRepeatLimit="marquee_forever"
            android:focusable="true"
            android:focusableInTouchMode="true"
            android:scrollHorizontally="true"
            android:paddingStart="10dp"
            android:paddingEnd="10dp"
            android:text="   Contact Now WhatsApp: 03333997576   |   AKS ONLINE 100 Mobiles Control Panel   |   Contact Now: 03333997576   " />

          <!-- Master Control Panel -->
          <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:background="#004D40"
            android:padding="7dp">

            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:paddingBottom="4dp">

              <TextView
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:text="AKS ONLINE (1-100)"
                android:textColor="#FFFFFF"
                android:textStyle="bold"
                android:textSize="14sp" />

              <Button
                android:id="@+id/btnBulkIp"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="100 IPs"
                android:textSize="10sp"
                android:backgroundTint="#FF8F00"
                android:textColor="#FFFFFF"
                android:layout_marginEnd="3dp" />

              <Button
                android:id="@+id/btnGmail"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="Gmail"
                android:textSize="10sp"
                android:backgroundTint="#1976D2"
                android:textColor="#FFFFFF"
                android:layout_marginEnd="3dp" />

              <Button
                android:id="@+id/btnYouTube"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="YT"
                android:textSize="10sp"
                android:backgroundTint="#D32F2F"
                android:textColor="#FFFFFF"
                android:layout_marginEnd="3dp" />

              <Button
                android:id="@+id/btnTikTok"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="TT"
                android:textSize="10sp"
                android:backgroundTint="#111111"
                android:textColor="#FFFFFF"
                android:layout_marginEnd="3dp" />

              <Button
                android:id="@+id/btnFacebook"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="FB"
                android:textSize="10sp"
                android:backgroundTint="#0D47A1"
                android:textColor="#FFFFFF" />
            </LinearLayout>

            <!-- 100 Mobiles Batch Selector (1-10 to 91-100 & ALL 100) -->
            <HorizontalScrollView
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:scrollbars="none"
              android:paddingBottom="4dp">
              <LinearLayout
                android:id="@+id/batchBar"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:orientation="horizontal" />
            </HorizontalScrollView>

            <!-- Master URL & Command Bar -->
            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical">

              <EditText
                android:id="@+id/etUrl"
                android:layout_width="0dp"
                android:layout_height="38dp"
                android:layout_weight="1"
                android:background="#FFFFFF"
                android:hint="Paste YouTube / TikTok / Facebook Link..."
                android:paddingStart="10dp"
                android:paddingEnd="10dp"
                android:singleLine="true"
                android:textColor="#000000"
                android:textSize="12sp" />

              <androidx.appcompat.widget.AppCompatButton
                android:id="@+id/btnPlayActive"
                android:layout_width="wrap_content"
                android:layout_height="38dp"
                android:layout_marginStart="6dp"
                android:background="@drawable/bg_3d_btn"
                android:paddingStart="12dp"
                android:paddingEnd="12dp"
                android:text="PLAY ALL"
                android:textColor="#FFFFFF"
                android:textSize="11sp"
                android:textStyle="bold" />

              <Button
                android:id="@+id/btnReloadActive"
                android:layout_width="40dp"
                android:layout_height="38dp"
                android:layout_marginStart="4dp"
                android:text="↻"
                android:textSize="15sp"
                android:backgroundTint="#37474F"
                android:textColor="#FFFFFF" />
            </LinearLayout>
          </LinearLayout>

          <!-- 100 Virtual Mobiles Grid -->
          <ScrollView
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:fillViewport="true">

            <LinearLayout
              android:id="@+id/gridContainer"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="4dp" />
          </ScrollView>

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/aks/online100/MainActivity.kt
        package com.aks.online100

        import android.annotation.SuppressLint
        import android.app.AlertDialog
        import android.content.Context
        import android.content.Intent
        import android.graphics.Color
        import android.media.AudioManager
        import android.media.ToneGenerator
        import android.net.Uri
        import android.os.Bundle
        import android.view.Gravity
        import android.view.View
        import android.view.ViewGroup
        import android.webkit.*
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.webkit.ProxyConfig
        import androidx.webkit.ProxyController
        import androidx.webkit.WebViewCompat
        import androidx.webkit.WebViewFeature

        class MainActivity : AppCompatActivity() {

          private val totalPhones = 100
          private val webViews = arrayOfNulls<WebView>(totalPhones)
          private val cardContainers = mutableListOf<LinearLayout>()
          private val rowContainers = mutableListOf<LinearLayout>()
          private val titleViews = mutableListOf<TextView>()
          private val ipLabels = mutableListOf<TextView>()
          private var expandedIndex = -1
          private var activeStartIdx = 0
          private var activeEndIdx = 9
          private var toneGen: ToneGenerator? = null
          private lateinit var gridContainer: LinearLayout

          private val brandPool = listOf(
            "Galaxy S24", "Vivo V30", "Oppo Reno12", "Xiaomi 14", "Pixel 8 Pro",
            "Realme 12+", "OnePlus 12", "Infinix Note40", "Tecno Camon30", "Redmi Note13",
            "Galaxy A55", "Vivo Y200", "Oppo F27", "Poco X6 Pro", "Pixel 8a",
            "Realme GT6", "OnePlus Nord4", "Infinix Zero30", "Tecno Spark20", "Redmi 13C"
          )

          override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            setContentView(R.layout.activity_main)

            try {
              toneGen = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 90)
            } catch (_: Exception) {}

            val tvContactTicker = findViewById<TextView>(R.id.tvContactTicker)
            tvContactTicker.isSelected = true
            tvContactTicker.setOnClickListener {
              playBeep()
              try {
                startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/923333997576")))
              } catch (_: Exception) {}
            }

            val etUrl = findViewById<EditText>(R.id.etUrl)
            val btnPlayActive = findViewById<Button>(R.id.btnPlayActive)
            val btnReloadActive = findViewById<Button>(R.id.btnReloadActive)
            val btnBulkIp = findViewById<Button>(R.id.btnBulkIp)
            val btnGmail = findViewById<Button>(R.id.btnGmail)
            val btnYouTube = findViewById<Button>(R.id.btnYouTube)
            val btnTikTok = findViewById<Button>(R.id.btnTikTok)
            val btnFacebook = findViewById<Button>(R.id.btnFacebook)
            val batchBar = findViewById<LinearLayout>(R.id.batchBar)
            gridContainer = findViewById(R.id.gridContainer)

            buildBatchButtons(batchBar)
            buildHundredCardsSkeleton()
            showBatch(0, 9)

            btnBulkIp.setOnClickListener {
              playBeep()
              showBulkIpDialog()
            }

            btnGmail.setOnClickListener {
              playBeep()
              etUrl.setText("https://accounts.google.com")
              loadUrlInActiveBatch("https://accounts.google.com")
            }

            btnYouTube.setOnClickListener {
              playBeep()
              etUrl.setText("https://m.youtube.com")
              loadUrlInActiveBatch("https://m.youtube.com")
            }

            btnTikTok.setOnClickListener {
              playBeep()
              etUrl.setText("https://www.tiktok.com")
              loadUrlInActiveBatch("https://www.tiktok.com")
            }

            btnFacebook.setOnClickListener {
              playBeep()
              etUrl.setText("https://m.facebook.com")
              loadUrlInActiveBatch("https://m.facebook.com")
            }

            btnPlayActive.setOnClickListener {
              playBeep()
              var url = etUrl.text.toString().trim()
              if (url.isEmpty()) {
                Toast.makeText(this, "Paste Video/Post Link First!", Toast.LENGTH_SHORT).show()
                return@setOnClickListener
              }
              if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://$url"
              }
              loadUrlInActiveBatch(url)
            }

            btnReloadActive.setOnClickListener {
              playBeep()
              for (i in activeStartIdx..activeEndIdx) {
                applyProxyForSlot(i)
                webViews[i]?.reload()
              }
              Toast.makeText(this, "Reloaded Mobiles ${activeStartIdx + 1}-${activeEndIdx + 1}", Toast.LENGTH_SHORT).show()
            }
          }

          private fun buildBatchButtons(batchBar: LinearLayout) {
            for (b in 0 until 10) {
              val start = b * 10
              val end = start + 9
              val btn = Button(this).apply {
                text = "${start + 1}-${end + 1}"
                textSize = 10f
                setTextColor(Color.WHITE)
                setBackgroundColor(Color.parseColor("#00796B"))
                layoutParams = LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.WRAP_CONTENT,
                  84
                ).apply { setMargins(0, 0, 8, 0) }
                setOnClickListener {
                  playBeep()
                  showBatch(start, end)
                }
              }
              batchBar.addView(btn)
            }
            val btnAll = Button(this).apply {
              text = "ALL 100"
              textSize = 10f
              setTextColor(Color.WHITE)
              setBackgroundColor(Color.parseColor("#E65100"))
              layoutParams = LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.WRAP_CONTENT,
                84
              )
              setOnClickListener {
                playBeep()
                showBatch(0, 99)
              }
            }
            batchBar.addView(btnAll)
          }

          private fun buildHundredCardsSkeleton() {
            val prefs = getSharedPreferences("AKS_ONLINE_100_PREFS", Context.MODE_PRIVATE)
            for (rowIdx in 0 until 50) {
              val row = LinearLayout(this).apply {
                orientation = LinearLayout.HORIZONTAL
                layoutParams = LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  560
                ).apply { setMargins(0, 4, 0, 4) }
              }
              rowContainers.add(row)

              for (colIdx in 0 until 2) {
                val idx = rowIdx * 2 + colIdx
                val defaultModel = "${idx + 1}. ${brandPool[idx % brandPool.size]}_M${idx + 1}"
                val savedName = prefs.getString("name_$idx", defaultModel) ?: defaultModel
                val savedIp = prefs.getString("ip_$idx", "") ?: ""

                val phoneCard = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setBackgroundResource(R.drawable.bg_phone_frame)
                  setPadding(6, 6, 6, 6)
                  layoutParams = LinearLayout.LayoutParams(
                    0,
                    ViewGroup.LayoutParams.MATCH_PARENT,
                    1f
                  ).apply { setMargins(4, 0, 4, 0) }
                }

                val header = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  gravity = Gravity.CENTER_VERTICAL
                  setBackgroundColor(Color.parseColor("#004D40"))
                  setPadding(6, 2, 6, 2)
                }

                val tvTitle = TextView(this).apply {
                  text = savedName
                  setTextColor(Color.WHITE)
                  textSize = 10f
                  layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  setOnClickListener { promptRenamePhone(idx) }
                }
                titleViews.add(tvTitle)

                val btnZoom = TextView(this).apply {
                  text = " [FULL]"
                  setTextColor(Color.parseColor("#FFD54F"))
                  textSize = 11f
                  setOnClickListener {
                    playBeep()
                    toggleExpandPhone(idx)
                  }
                }

                header.addView(tvTitle)
                header.addView(btnZoom)

                val tvIpSub = TextView(this).apply {
                  text = "IP: ${savedIp.ifEmpty { "Tap to Set IP" }}"
                  setTextColor(Color.parseColor("#80CBC4"))
                  setBackgroundColor(Color.parseColor("#1C2833"))
                  textSize = 9f
                  setPadding(6, 1, 6, 1)
                  setOnClickListener { promptSingleIp(idx) }
                }
                ipLabels.add(tvIpSub)

                // Quick Built-in App Bar inside every Mobile (YT | TT | FB | Gmail)
                val miniAppBar = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  setBackgroundColor(Color.parseColor("#16222F"))
                  setPadding(2, 2, 2, 2)
                }
                val apps = listOf(
                  "Gmail" to "https://accounts.google.com",
                  "YT" to "https://m.youtube.com",
                  "TT" to "https://www.tiktok.com",
                  "FB" to "https://m.facebook.com"
                )
                for ((label, appUrl) in apps) {
                  val chip = TextView(this).apply {
                    text = label
                    setTextColor(Color.WHITE)
                    textSize = 9f
                    gravity = Gravity.CENTER
                    layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                    setOnClickListener {
                      playBeep()
                      ensureWebViewCreated(idx).loadUrl(appUrl)
                    }
                  }
                  miniAppBar.addView(chip)
                }

                phoneCard.addView(header)
                phoneCard.addView(tvIpSub)
                phoneCard.addView(miniAppBar)
                row.addView(phoneCard)
                cardContainers.add(phoneCard)
              }
              gridContainer.addView(row)
            }
          }

          @SuppressLint("SetJavaScriptEnabled")
          private fun ensureWebViewCreated(idx: Int): WebView {
            webViews[idx]?.let { return it }
            applyProxyForSlot(idx)
            val modelTag = brandPool[idx % brandPool.size].replace(" ", "_") + "_ID${idx + 1}"
            val androidVer = 11 + (idx % 4)
            val chromeBuild = 118 + (idx % 8)

            val wv = WebView(this).apply {
              layoutParams = LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                0,
                1f
              )
              settings.apply {
                javaScriptEnabled = true
                domStorageEnabled = true
                databaseEnabled = true
                mediaPlaybackRequiresUserGesture = false
                loadWithOverviewMode = true
                useWideViewPort = true
                userAgentString = "Mozilla/5.0 (Linux; Android $androidVer; $modelTag) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/$chromeBuild.0.0.0 Mobile Safari/537.36"
              }

              if (WebViewFeature.isFeatureSupported(WebViewFeature.MULTI_PROFILE)) {
                try {
                  WebViewCompat.setProfile(this, "AKS_Online_Profile_${idx + 1}")
                } catch (_: Exception) {}
              }

              val cm = CookieManager.getInstance()
              cm.setAcceptCookie(true)
              cm.setAcceptThirdPartyCookies(this, true)

              webViewClient = object : WebViewClient() {
                override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean = false
                override fun onPageFinished(view: WebView?, url: String?) {
                  super.onPageFinished(view, url)
                  view?.evaluateJavascript(
                    "document.querySelectorAll('video').forEach(v => { v.play(); });",
                    null
                  )
                }
              }
              webChromeClient = WebChromeClient()
              loadUrl("https://m.youtube.com")
            }
            webViews[idx] = wv
            cardContainers[idx].addView(wv)
            return wv
          }

          private fun applyProxyForSlot(idx: Int) {
            val prefs = getSharedPreferences("AKS_ONLINE_100_PREFS", Context.MODE_PRIVATE)
            val proxyAddr = prefs.getString("ip_$idx", "") ?: ""
            if (proxyAddr.contains(":") && WebViewFeature.isFeatureSupported(WebViewFeature.PROXY_OVERRIDE)) {
              try {
                val proxyConfig = ProxyConfig.Builder()
                  .addProxyRule(proxyAddr.trim())
                  .addDirect()
                  .build()
                ProxyController.getInstance().setProxyOverride(proxyConfig, { it.run() }, {})
              } catch (_: Exception) {}
            }
          }

          private fun showBulkIpDialog() {
            val prefs = getSharedPreferences("AKS_ONLINE_100_PREFS", Context.MODE_PRIVATE)
            val sb = StringBuilder()
            for (i in 0 until totalPhones) {
              val ip = prefs.getString("ip_$i", "") ?: ""
              if (ip.isNotEmpty()) sb.append(ip).append("\n")
            }
            val input = EditText(this).apply {
              hint = "Paste up to 100 Unique Proxy IPs (1 per line, e.g. 103.25.44.12:8080)"
              minLines = 8
              maxLines = 14
              setText(sb.toString())
            }
            AlertDialog.Builder(this)
              .setTitle("Assign 100 Separate IPs")
              .setView(input)
              .setPositiveButton("Save All IPs") { _, _ ->
                val lines = input.text.toString().lines().map { it.trim() }.filter { it.isNotEmpty() }
                val editor = prefs.edit()
                for (i in 0 until totalPhones) {
                  val assigned = if (i < lines.size) lines[i] else ""
                  editor.putString("ip_$i", assigned)
                  ipLabels[i].text = "IP: ${assigned.ifEmpty { "Tap to Set IP" }}"
                }
                editor.apply()
                Toast.makeText(this, "Saved ${lines.size} Unique IPs!", Toast.LENGTH_SHORT).show()
              }
              .setNegativeButton("Cancel", null)
              .show()
          }

          private fun promptSingleIp(idx: Int) {
            val prefs = getSharedPreferences("AKS_ONLINE_100_PREFS", Context.MODE_PRIVATE)
            val input = EditText(this).apply {
              hint = "e.g. 103.45.12.8:8080"
              setText(prefs.getString("ip_$idx", ""))
            }
            AlertDialog.Builder(this)
              .setTitle("Set IP for ${titleViews[idx].text}")
              .setView(input)
              .setPositiveButton("Save") { _, _ ->
                val ip = input.text.toString().trim()
                prefs.edit().putString("ip_$idx", ip).apply()
                ipLabels[idx].text = "IP: ${ip.ifEmpty { "Tap to Set IP" }}"
                applyProxyForSlot(idx)
                webViews[idx]?.reload()
              }
              .setNegativeButton("Cancel", null)
              .show()
          }

          private fun showBatch(startIdx: Int, endIdx: Int) {
            expandedIndex = -1
            activeStartIdx = startIdx
            activeEndIdx = endIdx

            for (r in rowContainers.indices) {
              val rowStart = r * 2
              val rowEnd = rowStart + 1
              if (rowEnd >= startIdx && rowStart <= endIdx) {
                rowContainers[r].visibility = View.VISIBLE
                rowContainers[r].layoutParams = LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  560
                ).apply { setMargins(0, 4, 0, 4) }
              } else {
                rowContainers[r].visibility = View.GONE
              }
            }

            for (i in 0 until totalPhones) {
              if (i in startIdx..endIdx) {
                cardContainers[i].visibility = View.VISIBLE
                ensureWebViewCreated(i)
              } else {
                cardContainers[i].visibility = View.GONE
              }
            }
            Toast.makeText(this, "Mobiles ${startIdx + 1} to ${endIdx + 1} Active", Toast.LENGTH_SHORT).show()
          }

          private fun toggleExpandPhone(targetIndex: Int) {
            if (expandedIndex == targetIndex) {
              showBatch(activeStartIdx, activeEndIdx)
            } else {
              expandedIndex = targetIndex
              ensureWebViewCreated(targetIndex)
              val targetRow = targetIndex / 2
              for (r in rowContainers.indices) {
                if (r == targetRow) {
                  rowContainers[r].visibility = View.VISIBLE
                  rowContainers[r].layoutParams = LinearLayout.LayoutParams(
                    ViewGroup.LayoutParams.MATCH_PARENT,
                    1400
                  )
                } else {
                  rowContainers[r].visibility = View.GONE
                }
              }
              for (c in 0 until totalPhones) {
                cardContainers[c].visibility = if (c == targetIndex) View.VISIBLE else View.GONE
              }
            }
          }

          private fun loadUrlInActiveBatch(url: String) {
            var delay = 0L
            for (i in activeStartIdx..activeEndIdx) {
              val wv = ensureWebViewCreated(i)
              wv.postDelayed({
                applyProxyForSlot(i)
                wv.loadUrl(url)
              }, delay)
              delay += 250L
            }
            Toast.makeText(this, "Playing on Mobiles ${activeStartIdx + 1}-${activeEndIdx + 1}", Toast.LENGTH_SHORT).show()
          }

          private fun promptRenamePhone(idx: Int) {
            val input = EditText(this).apply {
              setText(titleViews[idx].text.toString())
            }
            AlertDialog.Builder(this)
              .setTitle("Rename Mobile ${idx + 1}")
              .setView(input)
              .setPositiveButton("Save") { _, _ ->
                val newName = input.text.toString().trim().ifEmpty { "${idx + 1}. ${brandPool[idx % brandPool.size]}" }
                titleViews[idx].text = newName
                getSharedPreferences("AKS_ONLINE_100_PREFS", Context.MODE_PRIVATE)
                  .edit().putString("name_$idx", newName).apply()
              }
              .setNegativeButton("Cancel", null)
              .show()
          }

          private fun playBeep() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_BEEP, 120) } catch (_: Exception) {}
          }

          override fun onDestroy() {
            super.onDestroy()
            toneGen?.release()
          }
        }
        EOF

        sed -i 's/^        //' settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/res/values/strings.xml app/src/main/res/drawable/bg_phone_frame.xml app/src/main/res/drawable/bg_3d_btn.xml app/src/main/res/drawable/ic_aks_online.xml app/src/main/AndroidManifest.xml app/src/main/res/layout/activity_main.xml app/src/main/java/com/aks/online100/MainActivity.kt

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AKS-ONLINE-100-APK
        path: app/build/outputs/apk/debug/app-debug.apk
