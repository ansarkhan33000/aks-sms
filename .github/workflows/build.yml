        cat << 'EOF' > app/src/main/java/com/aks/smsservice/MainActivity.kt
        package com.aks.smsservice

        import android.Manifest
        import android.content.*
        import android.content.pm.PackageManager
        import android.media.AudioManager
        import android.media.ToneGenerator
        import android.net.Uri
        import android.os.*
        import android.telephony.SmsManager
        import android.telephony.SubscriptionManager
        import android.telephony.TelephonyManager
        import android.view.SoundEffectConstants
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import java.text.SimpleDateFormat
        import java.util.*

        class MainActivity : AppCompatActivity() {

          private lateinit var tvStatus: TextView
          private lateinit var tvUssdDetails: TextView
          private lateinit var tvSentMsg: TextView
          private lateinit var tvReport: TextView
          private lateinit var etFormat: EditText
          private lateinit var etSerial: EditText
          private lateinit var prefs: SharedPreferences
          private var toneGen: ToneGenerator? = null

          override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            setContentView(R.layout.activity_main)

            try {
              toneGen = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 95)
            } catch (_: Exception) {}

            prefs = getSharedPreferences("AKS_SMS_SERVICE_PREFS", Context.MODE_PRIVATE)
            val rbSim1 = findViewById<RadioButton>(R.id.rbSim1)
            val btnStart = findViewById<Button>(R.id.btnStart)
            val btnSaveSettings = findViewById<Button>(R.id.btnSaveSettings)
            val btnCopyReport = findViewById<Button>(R.id.btnCopyReport)
            val btnClearReport = findViewById<Button>(R.id.btnClearReport)
            val btnWhatsApp = findViewById<Button>(R.id.btnWhatsApp)

            etFormat = findViewById(R.id.etFormat)
            etSerial = findViewById(R.id.etSerial)
            tvStatus = findViewById(R.id.tvStatus)
            tvUssdDetails = findViewById(R.id.tvUssdDetails)
            tvSentMsg = findViewById(R.id.tvSentMsg)
            tvReport = findViewById(R.id.tvReport)

            val savedSerial = prefs.getInt("serial_num", 1).coerceAtLeast(1)
            val savedFormat = prefs.getString("sms_format", "REG {CNIC} KMA{SERIAL} S 03102018") ?: "REG {CNIC} KMA{SERIAL} S 03102018"
            val savedReport = prefs.getString("full_report", "") ?: ""

            etSerial.setText(savedSerial.toString())
            etFormat.setText(savedFormat)
            if (savedReport.isNotEmpty()) {
              tvReport.text = savedReport
            }

            checkPermissions()

            btnSaveSettings.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              val enteredSerial = etSerial.text.toString().toIntOrNull()
              val enteredFormat = etFormat.text.toString().trim()
              if (enteredSerial == null || enteredSerial < 1 || enteredFormat.isEmpty()) {
                playErrorSound()
                Toast.makeText(this, "Enter valid Serial (>=1) and Format", Toast.LENGTH_SHORT).show()
              } else {
                prefs.edit()
                  .putInt("serial_num", enteredSerial)
                  .putString("sms_format", enteredFormat)
                  .apply()
                playSuccessSound()
                Toast.makeText(this, "Saved! Next Serial: $enteredSerial", Toast.LENGTH_SHORT).show()
              }
            }

            btnStart.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              playStartSound()
              if (!checkPermissions()) return@setOnClickListener

              val currentFormat = etFormat.text.toString().trim()
              if (currentFormat.isNotEmpty()) {
                prefs.edit().putString("sms_format", currentFormat).apply()
              }

              val simSlot = if (rbSim1.isChecked) 0 else 1
              dialAndExecute("*336*1*2#", simSlot)
            }

            btnCopyReport.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              copyToClipboard("AKS_REPORT", tvReport.text.toString())
              playSuccessSound()
            }

            btnClearReport.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              prefs.edit().putString("full_report", "").apply()
              tvReport.text = "No reports yet...\n"
              Toast.makeText(this, "Report Cleared", Toast.LENGTH_SHORT).show()
            }

            btnWhatsApp.setOnClickListener {
              it.playSoundEffect(SoundEffectConstants.CLICK)
              playStartSound()
              try {
                startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/923333997576")))
              } catch (e: Exception) {
                Toast.makeText(this, "WhatsApp: 03333997576", Toast.LENGTH_LONG).show()
              }
            }
          }

          private fun dialAndExecute(ussdCode: String, simSlot: Int) {
            try {
              if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED ||
                  ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED ||
                  ActivityCompat.checkSelfPermission(this, Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) {
                checkPermissions()
                return
              }

              tvStatus.text = "Status: Dialing $ussdCode on SIM ${simSlot + 1}..."
              val subId = getSubIdForSlot(simSlot)
              val baseManager = getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
              val telephonyManager = baseManager.createForSubscriptionId(subId)

              telephonyManager.sendUssdRequest(
                ussdCode,
                object : TelephonyManager.UssdResponseCallback() {
                  override fun onReceiveUssdResponse(tm: TelephonyManager, request: String, response: CharSequence) {
                    val reply = response.toString().trim()
                    tvUssdDetails.text = "USSD Reply: $reply"

                    val cleanDigits = reply.replace("-", "")
                    val match = Regex("\\b\\d{13}\\b").find(cleanDigits)

                    if (match != null) {
                      val cnic = match.value
                      copyToClipboard("CNIC", cnic)

                      val currentSerial = prefs.getInt("serial_num", 1).coerceAtLeast(1)
                      val template = prefs.getString("sms_format", "REG {CNIC} KMA{SERIAL} S 03102018") ?: "REG {CNIC} KMA{SERIAL} S 03102018"

                      val finalSms = template
                        .replace("{CNIC}", cnic)
                        .replace("{SERIAL}", currentSerial.toString())

                      sendSmsTo971(finalSms, subId)

                      val nextSerial = currentSerial + 1
                      prefs.edit().putInt("serial_num", nextSerial).apply()
                      etSerial.setText(nextSerial.toString())

                      val timeStr = SimpleDateFormat("dd-MM HH:mm:ss", Locale.getDefault()).format(Date())
                      val reportEntry = "[$timeStr] SIM${simSlot + 1} | #$currentSerial | CNIC: $cnic\nSent 971: $finalSms\nReply: $reply\n------------------------------\n"

                      val prevReport = prefs.getString("full_report", "") ?: ""
                      val updatedReport = reportEntry + prevReport
                      prefs.edit().putString("full_report", updatedReport).apply()

                      tvSentMsg.text = "Sent to 971:\n$finalSms"
                      tvStatus.text = "Status: Success! Serial #$currentSerial Sent. Next: #$nextSerial"
                      tvReport.text = updatedReport
                      playSuccessSound()
                    } else {
                      playErrorSound()
                      tvStatus.text = "Status: CNIC not found in reply!"
                    }
                  }

                  override fun onReceiveUssdResponseFailed(tm: TelephonyManager, request: String, failureCode: Int) {
                    playErrorSound()
                    tvStatus.text = "Status: USSD Failed (Error Code: $failureCode)"
                  }
                },
                Handler(Looper.getMainLooper())
              )
            } catch (e: Exception) {
              playErrorSound()
              tvStatus.text = "Error: ${e.message}"
            }
          }

          private fun sendSmsTo971(message: String, subId: Int) {
            val smsManager = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
              getSystemService(SmsManager::class.java).createForSubscriptionId(subId)
            } else {
              @Suppress("DEPRECATION")
              SmsManager.getSmsManagerForSubscriptionId(subId)
            }
            smsManager.sendTextMessage("971", null, message, null, null)
          }

          private fun getSubIdForSlot(simSlot: Int): Int {
            if (ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED) {
              val subManager = getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE) as SubscriptionManager
              val subList = subManager.activeSubscriptionInfoList
              if (!subList.isNullOrEmpty() && simSlot < subList.size) {
                return subList[simSlot].subscriptionId
              }
            }
            return SubscriptionManager.getDefaultSubscriptionId()
          }

          private fun copyToClipboard(label: String, text: String) {
            val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
            clipboard.setPrimaryClip(ClipData.newPlainText(label, text))
            Toast.makeText(this, "Copied: $text", Toast.LENGTH_SHORT).show()
          }

          private fun playStartSound() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_BEEP, 150) } catch (_: Exception) {}
          }

          private fun playSuccessSound() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_ACK, 300) } catch (_: Exception) {}
          }

          private fun playErrorSound() {
            try { toneGen?.startTone(ToneGenerator.TONE_PROP_NACK, 350) } catch (_: Exception) {}
          }

          private fun checkPermissions(): Boolean {
            val perms = arrayOf(
              Manifest.permission.CALL_PHONE,
              Manifest.permission.SEND_SMS,
              Manifest.permission.READ_PHONE_STATE
            )
            val needed = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
            return if (needed.isNotEmpty()) {
              ActivityCompat.requestPermissions(this, needed.toTypedArray(), 105)
              false
            } else true
          }

          override fun onDestroy() {
            super.onDestroy()
            toneGen?.release()
          }
        }
