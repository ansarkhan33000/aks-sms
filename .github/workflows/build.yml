package com.aks.app

import android.app.Activity
import android.os.Bundle
import android.content.Intent
import android.graphics.Color
import android.graphics.Typeface
import android.graphics.drawable.GradientDrawable
import android.media.ToneGenerator
import android.media.AudioManager
import android.net.Uri
import android.view.Gravity
import android.view.View
import android.view.animation.LinearInterpolator
import android.animation.ObjectAnimator
import android.widget.*

class MainActivity : Activity() {

    private val gold = Color.rgb(230, 180, 65)
    private val dark = Color.rgb(10, 15, 29)
    private val white = Color.WHITE
    private val whatsapp = "92333997576"

    private val sound = ToneGenerator(
        AudioManager.STREAM_MUSIC, 90
    )

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        showLogin()
    }

    private fun playLogin() {
        sound.startTone(ToneGenerator.TONE_PROP_BEEP, 180)
    }

    private fun playSuccess() {
        sound.startTone(ToneGenerator.TONE_PROP_ACK, 300)
    }

    private fun playError() {
        sound.startTone(ToneGenerator.TONE_PROP_NACK, 350)
    }

    private fun playButton() {
        sound.startTone(ToneGenerator.TONE_PROP_BEEP, 90)
    }

    private fun background(): GradientDrawable {
        return GradientDrawable(
            GradientDrawable.Orientation.TL_BR,
            intArrayOf(
                Color.rgb(7, 12, 25),
                Color.rgb(30, 37, 59),
                Color.rgb(7, 12, 25)
            )
        )
    }

    private fun round(color: Int): GradientDrawable {
        return GradientDrawable().apply {
            setColor(color)
            cornerRadius = 25f
        }
    }

    private fun makeText(
        value: String,
        size: Float,
        color: Int
    ): TextView {
        return TextView(this).apply {
            text = value
            textSize = size
            setTextColor(color)
            gravity = Gravity.CENTER
        }
    }

    private fun makeButton(value: String): Button {
        return Button(this).apply {
            text = value
            textSize = 16f
            isAllCaps = false
            setTextColor(Color.BLACK)
            background = round(gold)
            elevation = 10f
        }
    }

    private fun createRoot(): LinearLayout {
        return LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER
            setPadding(25, 25, 25, 25)
            background = background()
        }
    }

    private fun addLogo(root: LinearLayout) {

        val logo = TextView(this).apply {
            text = "A K S"
            textSize = 48f
            setTextColor(gold)
            gravity = Gravity.CENTER
            typeface = Typeface.create(
                "sans-serif-black",
                Typeface.BOLD
            )
            elevation = 20f
            background = GradientDrawable(
                GradientDrawable.Orientation.TL_BR,
                intArrayOf(
                    Color.rgb(100, 72, 20),
                    Color.rgb(20, 25, 40)
                )
            ).apply {
                cornerRadius = 100f
                setStroke(4, gold)
            }
        }

        root.addView(
            logo,
            LinearLayout.LayoutParams(240, 130)
        )

        ObjectAnimator.ofFloat(
            logo,
            View.ROTATION_Y,
            0f,
            360f
        ).apply {
            duration = 4000
            repeatCount = ObjectAnimator.INFINITE
            interpolator = LinearInterpolator()
            start()
        }

        ObjectAnimator.ofFloat(
            logo,
            View.SCALE_X,
            1f, 1.08f, 1f
        ).apply {
            duration = 2200
            repeatCount = ObjectAnimator.INFINITE
            start()
        }
    }

    private fun showLogin() {

        val root = createRoot()

        addLogo(root)

        root.addView(
            makeText("WELCOME TO AKS", 24f, white)
        )

        root.addView(
            makeText("PREMIUM APPLICATION", 14f, gold)
        )

        val username = EditText(this).apply {
            hint = "Enter Username"
            setHintTextColor(Color.LTGRAY)
            setTextColor(white)
            singleLine = true
            background = round(Color.rgb(43, 50, 68))
            setPadding(20, 10, 20, 10)
        }

        val password = EditText(this).apply {
            hint = "Enter Password"
            setHintTextColor(Color.LTGRAY)
            setTextColor(white)
            inputType = 129
            singleLine = true
            background = round(Color.rgb(43, 50, 68))
            setPadding(20, 10, 20, 10)
        }

        root.addView(
            username,
            LinearLayout.LayoutParams(-1, 60).apply {
                topMargin = 35
                bottomMargin = 15
            }
        )

        root.addView(
            password,
            LinearLayout.LayoutParams(-1, 60).apply {
                bottomMargin = 20
            }
        )

        val status = makeText(
            "Please Login",
            14f,
            white
        )

        root.addView(status)

        val login = makeButton("LOGIN")

        root.addView(
            login,
            LinearLayout.LayoutParams(-1, 60).apply {
                topMargin = 15
            }
        )

        login.setOnClickListener {

            playLogin()

            if (
                username.text.toString().isBlank() ||
                password.text.toString().length < 4
            ) {
                playError()
                status.text = "Login Error! Check your details"
                status.setTextColor(Color.RED)

            } else {

                playSuccess()

                showDashboard(
                    username.text.toString()
                )
            }
        }

        val whatsApp = makeButton(
            "CONTACT ON WHATSAPP"
        )

        root.addView(
            whatsApp,
            LinearLayout.LayoutParams(-1, 55).apply {
                topMargin = 20
            }
        )

        whatsApp.setOnClickListener {
            playButton()
            openWhatsApp()
        }

        setContentView(root)
    }

    private fun showDashboard(user: String) {

        val root = createRoot()

        addLogo(root)

        root.addView(
            makeText("AKS DASHBOARD", 26f, gold)
        )

        root.addView(
            makeText("Welcome $user", 19f, white)
        )

        root.addView(
            makeText(
                "Your AKS application",
                15f,
                Color.LTGRAY
            )
        )

        val whatsApp = makeButton(
            "WHATSAPP CONTACT"
        )

        root.addView(
            whatsApp,
            LinearLayout.LayoutParams(-1, 60).apply {
                topMargin = 30
            }
        )

        whatsApp.setOnClickListener {
            playButton()
            openWhatsApp()
        }

        val logout = makeButton("LOGOUT")

        root.addView(
            logout,
            LinearLayout.LayoutParams(-1, 60).apply {
                topMargin = 15
            }
        )

        logout.setOnClickListener {
            playButton()
            showLogin()
        }

        setContentView(root)
    }

    private fun openWhatsApp() {

        val link = "https://wa.me/$whatsapp"

        try {
            val intent = Intent(
                Intent.ACTION_VIEW,
                Uri.parse(link)
            )
            startActivity(intent)

        } catch (e: Exception) {
            Toast.makeText(
                this,
                "WhatsApp not available",
                Toast.LENGTH_LONG
            ).show()
        }
    }

    override fun onDestroy() {
        super.onDestroy()
        sound.release()
    }
}
