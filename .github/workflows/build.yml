name: Build AKS DAILER 3D APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate AKS DAILER Project
      run: |
        mkdir -p app/src/main/java/com/aks/dailer app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml app/src/main/res/values

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories { google(); mavenCentral() }
        }
        rootProject.name = "AKS_DAILER"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
          id("com.android.application") version "8.2.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
        }
        android {
          namespace = "com.aks.dailer"
          compileSdk = 34
