        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.CALL_PHONE" />
          <uses-permission android:name="android.permission.SEND_SMS" />
          <uses-permission android:name="android.permission.READ_PHONE_STATE" />
          <application
            android:allowBackup="true"
            android:icon="@drawable/ic_aks_logo"
            android:roundIcon="@drawable/ic_aks_logo"
            android:label="AKS CNIC"
            android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
            <activity android:name=".MainActivity" android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
            </activity>
          </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
          android:layout_width="match_parent"
          android:layout_height="match_parent"
          android:background="#E0E5EC">

          <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="16dp">

            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="@drawable/bg_3d_header"
              android:elevation="10dp"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="18dp"
              android:layout_marginBottom="16dp">

              <ImageView
                android:layout_width="64dp"
                android:layout_height="64dp"
                android:src="@drawable/ic_aks_logo"
                android:contentDescription="AKS Logo" />

              <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="AKS CNIC"
                android:textColor="#FFFFFF"
                android:textSize="26sp"
                android:textStyle="bold"
                android:shadowColor="#00251A"
                android:shadowDx="2"
                android:shadowDy="3"
                android:shadowRadius="4"
                android:paddingTop="6dp" />

              <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="3D Auto USSD (*336*1*2#) &amp; 9771 Sender"
                android:textColor="#B2DFDB"
                android:textSize="13sp"
                android:textStyle="bold" />
            </LinearLayout>

            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="@drawable/bg_3d_card"
              android:elevation="8dp"
              android:orientation="vertical"
              android:padding="16dp"
              android:layout_marginBottom="16dp">

              <TextView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Select Active SIM"
                android:textColor="#37474F"
                android:textStyle="bold"
                android:gravity="center"
                android:paddingBottom="6dp" />

              <RadioGroup
                android:id="@+id/simGroup"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center"
                android:paddingBottom="12dp">
                <RadioButton
                  android:id="@+id/rbSim1"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="SIM 1"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  android:textColor="#004D40"
                  android:checked="true"
                  android:layout_marginEnd="36dp" />
                <RadioButton
                  android:id="@+id/rbSim2"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="SIM 2"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  android:textColor="#004D40" />
              </RadioGroup>

              <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical"
                android:background="#F5F7FA"
                android:padding="10dp">
                <TextView
