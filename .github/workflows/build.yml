name: Build AKS CNIC 3D APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate AKS CNIC 3D Project
      run: |
        mkdir -p app/src/main/java/com/aks/cnic app/src/main/res/layout app/src/main/res/drawable

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories { google(); mavenCentral() }
        }
        rootProject.name = "AKS_CNIC"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
          id("com.android.application") version "8.2.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
        }
        android {
          namespace = "com.aks.cnic"
          compileSdk = 34
          defaultConfig {
            applicationId = "com.aks.cnic"
            minSdk = 26
            targetSdk = 34
            versionCode = 1
            versionName = "1.0"
          }
          buildTypes {
            release { isMinifyEnabled = false }
          }
          compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
          implementation("androidx.core:core-ktx:1.12.0")
          implementation("androidx.appcompat:appcompat:1.6.1")
          implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_header.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
          <gradient
            android:startColor="#004D40"
            android:centerColor="#00796B"
            android:endColor="#26A69A"
            android:angle="135" />
          <corners android:radius="20dp" />
          <stroke android:width="2dp" android:color="#80CBC4" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="4dp" android:left="2dp" android:right="2dp">
            <shape android:shape="rectangle">
              <solid android:color="#B0BEC5" />
              <corners android:radius="18dp" />
            </shape>
          </item>
          <item android:bottom="4dp">
            <shape android:shape="rectangle">
              <gradient
                android:startColor="#FFFFFF"
                android:endColor="#ECEFF1"
                android:angle="270" />
              <corners android:radius="18dp" />
              <stroke android:width="1.5dp" android:color="#CFD8DC" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_btn_start.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="5dp">
            <shape android:shape="rectangle">
              <solid android:color="#00332C" />
              <corners android:radius="16dp" />
            </shape>
          </item>
          <item android:bottom="5dp">
            <shape android:shape="rectangle">
              <gradient
                android:startColor="#00897B"
                android:endColor="#004D40"
                android:angle="270" />
              <corners android:radius="16dp" />
              <stroke android:width="1.5dp" android:color="#A7FFEB" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_btn_whatsapp.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="4dp">
            <shape android:shape="rectangle">
              <solid android:color="#1B5E20" />
              <corners android:radius="16dp" />
            </shape>
          </item>
          <item android:bottom="4dp">
            <shape android:shape="rectangle">
              <gradient
                android:startColor="#43A047"
                android:endColor="#2E7D32"
                android:angle="270" />
              <corners android:radius="16dp" />
              <stroke android:width="1.5dp" android:color="#B9F6CA" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_aks_logo.xml
        <?xml version="1.0" encoding="utf-8"?>
