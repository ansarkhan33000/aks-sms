name: Build AKS SMS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/java/com/aks/sms app/src/main/res/layout

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories { google(); mavenCentral() }
        }
        rootProject.name = "AKS_SMS"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
          id("com.android.application") version "8.2.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
        }
        android {
          namespace = "com.aks.sms"
          compileSdk = 34
          defaultConfig {
            applicationId = "com.aks.sms"
            minSdk = 22
            targetSdk = 34
            versionCode = 1
            versionName = "1.0"
          }
          buildTypes {
            release { isMinifyEnabled = false }
          }
          compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
          implementation("androidx.core:core-ktx:1.12.0")
          implementation("androidx.appcompat:appcompat:1.6.1")
          implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.SEND_SMS" />
          <uses-permission android:name="android.permission.RECEIVE_SMS" />
          <uses-permission android:name="android.permission.READ_SMS" />
          <uses-permission android:name="android.permission.READ_PHONE_STATE" />
          <application
            android:allowBackup="true"
            android:label="AKS SMS"
            android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">
            <activity android:name=".MainActivity" android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
            </activity>
          </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
          android:layout_width="match_parent"
          android:layout_height="match_parent"
          android:background="#F4F6F8">
          <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="16dp">
            <TextView
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:text="AKS SMS - 668 Auto Verifier"
              android:textSize="20sp"
              android:textStyle="bold"
              android:textColor="#00695C"
              android:gravity="center"
              android:paddingBottom="12dp" />
            <RadioGroup
              android:id="@+id/simGroup"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center"
              android:paddingBottom="8dp">
              <RadioButton
                android:id="@+id/rbSim1"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="SIM 1"
                android:checked="true"
                android:layout_marginEnd="24dp" />
              <RadioButton
                android:id="@+id/rbSim2"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="SIM 2" />
            </RadioGroup>
            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:paddingBottom="8dp">
              <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Delay (1-50s): "
                android:textStyle="bold" />
              <EditText
                android:id="@+id/etDelay"
                android:layout_width="80dp"
                android:layout_height="wrap_content"
                android:inputType="number"
                android:text="5"
                android:gravity="center" />
            </LinearLayout>
            <EditText
              android:id="@+id/etCnics"
              android:layout_width="match_parent"
              android:layout_height="140dp"
              android:hint="Enter CNIC numbers (one per line)"
              android:inputType="textMultiLine"
              android:gravity="top|start"
              android:background="#FFFFFF"
              android:padding="10dp" />
            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:layout_marginTop="10dp">
              <Button
                android:id="@+id/btnStart"
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:text="Start Sending"
                android:backgroundTint="#00695C"
                android:textColor="#FFFFFF" />
              <Button
                android:id="@+id/btnStop"
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:layout_marginStart="8dp"
                android:text="Stop"
                android:backgroundTint="#C62828"
                android:textColor="#FFFFFF" />
            </LinearLayout>
            <TextView
              android:id="@+id/tvStatus"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:text="Status: Ready"
              android:textStyle="bold"
              android:paddingTop="10dp"
              android:paddingBottom="6dp" />
            <TextView
              android:id="@+id/tvResults"
              android:layout_width="match_parent"
              android:layout_height="180dp"
              android:background="#FFFFFF"
              android:padding="10dp"
              android:text="668 Replies will appear here...\n"
              android:textIsSelectable="true" />
            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:layout_marginTop="10dp">
              <Button
                android:id="@+id/btnCopy"
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:text="Copy Data" />
              <Button
                android:id="@+id/btnWhatsApp"
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:layout_marginStart="8dp"
                android:text="WhatsApp Help"
                android:backgroundTint="#2E7D32"
                android:textColor="#FFFFFF" />
            </LinearLayout>
          </LinearLayout>
        </ScrollView>
        EOF

        cat << 'EOF' > app/src/main/java/com/aks/sms/MainActivity.kt
        package com.aks.sms

        import android.Manifest
        import android.content.*
        import android.content.pm.PackageManager
        import android.net.Uri
        import android.os.*
        import android.provider.Telephony
        import android.telephony.SmsManager
        import android.telephony.SubscriptionManager
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat

        class MainActivity : AppCompatActivity() {
          private var isRunning = false
          private val handler = Handler(Looper.getMainLooper())
          private lateinit var tvStatus: TextView
          private lateinit var tvResults: TextView
          private var lastSentCnic = ""

          private val smsReceiver = object : BroadcastReceiver() {
            override fun onReceive(context: Context?, intent: Intent?) {
              if (intent?.action == Telephony.Sms.Intents.SMS_RECEIVED_ACTION) {
                val messages = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                for (msg in messages) {
                  val sender = msg.originatingAddress ?: ""
                  if (sender.contains("668")) {
                    val body = msg.messageBody ?: ""
                    tvResults.append("CNIC: $lastSentCnic\nReply: $body\n----------------\n")
                  }
                }
              }
            }
          }

          override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            setContentView(R.layout.activity_main)
            val rbSim1 = findViewById<RadioButton>(R.id.rbSim1)
            val etDelay = findViewById<EditText>(R.id.etDelay)
            val etCnics = findViewById<EditText>(R.id.etCnics)
            val btnStart = findViewById<Button>(R.id.btnStart)
            val btnStop = findViewById<Button>(R.id.btnStop)
            val btnCopy = findViewById<Button>(R.id.btnCopy)
            val btnWhatsApp = findViewById<Button>(R.id.btnWhatsApp)
            tvStatus = findViewById(R.id.tvStatus)
            tvResults = findViewById(R.id.tvResults)

            checkPermissions()
            registerReceiver(smsReceiver, IntentFilter(Telephony.Sms.Intents.SMS_RECEIVED_ACTION))

            btnStart.setOnClickListener {
              if (!checkPermissions()) return@setOnClickListener
              val list = etCnics.text.toString().lines().map { it.trim() }.filter { it.isNotEmpty() }
              if (list.isEmpty()) {
                Toast.makeText(this, "Enter at least 1 CNIC", Toast.LENGTH_SHORT).show()
                return@setOnClickListener
              }
              val delaySec = (etDelay.text.toString().toIntOrNull() ?: 5).coerceIn(1, 50)
              val simSlot = if (rbSim1.isChecked) 0 else 1
              isRunning = true
              sendNext(list, 0, delaySec, simSlot)
            }

            btnStop.setOnClickListener {
              isRunning = false
              handler.removeCallbacksAndMessages(null)
              tvStatus.text = "Status: Stopped"
            }

            btnCopy.setOnClickListener {
              val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              clipboard.setPrimaryClip(ClipData.newPlainText("AKS SMS Data", tvResults.text.toString()))
              Toast.makeText(this, "Data Copied!", Toast.LENGTH_SHORT).show()
            }

            btnWhatsApp.setOnClickListener {
              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/923333997576")))
            }
          }

          private fun sendNext(list: List<String>, index: Int, delaySec: Int, simSlot: Int) {
            if (!isRunning || index >= list.size) {
              isRunning = false
              tvStatus.text = "Status: Completed"
              return
            }
            val cnic = list[index]
            lastSentCnic = cnic
            tvStatus.text = "Sending (${index + 1}/${list.size}): $cnic"
            sendSmsViaSim(cnic, simSlot)
            handler.postDelayed({ sendNext(list, index + 1, delaySec, simSlot) }, delaySec * 1000L)
          }

          private fun sendSmsViaSim(text: String, simSlot: Int) {
            try {
              val subManager = getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE) as SubscriptionManager
              if (ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED) {
                val subList = subManager.activeSubscriptionInfoList
                val subId = if (!subList.isNullOrEmpty() && simSlot < subList.size) subList[simSlot].subscriptionId else SmsManager.getDefaultSmsSubscriptionId()
                val smsManager = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  getSystemService(SmsManager::class.java).createForSubscriptionId(subId)
                } else {
                  @Suppress("DEPRECATION")
                  SmsManager.getSmsManagerForSubscriptionId(subId)
                }
                smsManager.sendTextMessage("668", null, text, null, null)
              }
            } catch (e: Exception) {
              tvStatus.text = "Error: ${e.message}"
            }
          }

          private fun checkPermissions(): Boolean {
            val perms = arrayOf(Manifest.permission.SEND_SMS, Manifest.permission.RECEIVE_SMS, Manifest.permission.READ_SMS, Manifest.permission.READ_PHONE_STATE)
            val needed = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
            return if (needed.isNotEmpty()) {
              ActivityCompat.requestPermissions(this, needed.toTypedArray(), 101)
              false
            } else true
          }

          override fun onDestroy() {
            super.onDestroy()
            unregisterReceiver(smsReceiver)
          }
        }
        EOF

        sed -i 's/^        //' settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/res/layout/activity_main.xml app/src/main/java/com/aks/sms/MainActivity.kt

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AKS-SMS-APK
        path: app/build/outputs/apk/debug/app-debug.apk
