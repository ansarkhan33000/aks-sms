name: Build AKS DAILER Petrol 3D APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate AKS DAILER Project
      run: |
        mkdir -p app/src/main/java/com/aks/dailer app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml app/src/main/res/values

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories { google(); mavenCentral() }
        }
        rootProject.name = "AKS_DAILER"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
          id("com.android.application") version "8.2.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
        }
        android {
          namespace = "com.aks.dailer"
          compileSdk = 34
          defaultConfig {
            applicationId = "com.aks.dailer"
            minSdk = 24
            targetSdk = 34
            versionCode = 1
            versionName = "1.0"
          }
          buildTypes {
            release { isMinifyEnabled = false }
          }
          compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
          implementation("androidx.core:core-ktx:1.12.0")
          implementation("androidx.appcompat:appcompat:1.6.1")
          implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
          <string name="app_name">AKS DAILER</string>
          <string name="acc_desc">AKS DAILER Auto CNIC Reader</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
          android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
          android:accessibilityFeedbackType="feedbackGeneric"
          android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
          android:canRetrieveWindowContent="true"
          android:description="@string/acc_desc"
          android:notificationTimeout="100" />
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_header.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="6dp">
            <shape android:shape="rectangle">
              <solid android:color="#0D1B2A" />
              <corners android:radius="22dp" />
            </shape>
          </item>
          <item android:bottom="6dp">
            <shape android:shape="rectangle">
              <gradient
                android:startColor="#004D40"
                android:centerColor="#00796B"
                android:endColor="#26A69A"
                android:angle="135" />
              <corners android:radius="22dp" />
              <stroke android:width="2dp" android:color="#80CBC4" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="5dp" android:left="2dp" android:right="2dp">
            <shape android:shape="rectangle">
              <solid android:color="#90A4AE" />
              <corners android:radius="18dp" />
            </shape>
          </item>
          <item android:bottom="5dp">
            <shape android:shape="rectangle">
              <gradient
                android:startColor="#FFFFFF"
                android:endColor="#ECEFF1"
                android:angle="270" />
              <corners android:radius="18dp" />
              <stroke android:width="1.5dp" android:color="#CFD8DC" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_btn_start.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="6dp">
            <shape android:shape="rectangle">
              <solid android:color="#00251A" />
              <corners android:radius="18dp" />
            </shape>
          </item>
          <item android:bottom="6dp">
            <shape android:shape="rectangle">
              <gradient
                android:startColor="#00BFA5"
                android:centerColor="#00897B"
                android:endColor="#004D40"
                android:angle="270" />
              <corners android:radius="18dp" />
              <stroke android:width="2dp" android:color="#A7FFEB" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/bg_3d_btn_stop.xml
        <?xml version="1.0" encoding="utf-8"?>
        <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
          <item android:top="5dp">
            <shape android:shape="rectangle">
              <solid android:color="#7F0000" />
              <corners android:radius="18dp" />
            </shape>
          </item>
          <item android:bottom="5dp">
            <shape android:shape="rectangle">
              <gradient
                android:startColor="#EF5350"
                android:endColor="#C62828"
                android:angle="270" />
              <corners android:radius="18dp" />
              <stroke android:width="1.5dp" android:color="#FFCDD2" />
            </shape>
          </item>
        </layer-list>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_petrol_pump_3d.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
          android:width="108dp"
          android:height="108dp"
          android:viewportWidth="108"
          android:viewportHeight="108">
          <path android:fillColor="#00251A" android:pathData="M14,14 L94,14 Q102,14 102,22 L102,94 Q102,102 94,102 L14,102 Q6,102 6,94 L6,22 Q6,14 14,14 Z" />
          <path android:fillColor="#004D40" android:pathData="M14,8 L94,8 Q102,8 102,16 L102,88 Q102,96 94,96 L14,96 Q6,96 6,88 L6,16 Q6,8 14,8 Z" />
          <path android:fillColor="#263238" android:pathData="M24,82 L70,82 L70,88 L24,88 Z" />
          <path android:fillColor="#B71C1C" android:pathData="M62,24 L68,28 L68,82 L62,82 Z" />
          <path android:fillColor="#E53935" android:pathData="M30,22 L62,22 Q65,22 65,25 L65,82 L27,82 L27,25 Q27,22 30,22 Z" />
          <path android:fillColor="#FFCA28" android:pathData="M25,18 L67,18 L67,24 L25,24 Z" />
          <path android:fillColor="#E0F7FA" android:pathData="M33,30 L59,30 L59,48 L33,48 Z" />
          <path android:fillColor="#00695C" android:pathData="M36,34 L56,34 L56,38 L36,38 Z" />
          <path android:fillColor="#00897B" android:pathData="M36,41 L50,41 L50,44 L36,44 Z" />
          <path android:fillColor="#FFD54F" android:pathData="M46,54 C46,54 39,63 39,68 C39,72 42,75 46,75 C50,75 53,72 53,68 C53,63 46,54 46,54 Z" />
          <path android:fillColor="#ECEFF1" android:pathData="M65,42 L74,42 Q78,42 78,46 L78,70 Q78,75 73,75 L69,75 L69,71 L73,71 Q74,71 74,70 L74,46 L65,46 Z" />
          <path android:fillColor="#FFCA28" android:pathData="M71,34 L82,34 L82,42 L75,42 L75,38 L71,38 Z" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.CALL_PHONE" />
          <uses-permission android:name="android.permission.READ_PHONE_STATE" />
          <uses-permission android:name="android.permission.SEND_SMS" />
          <uses-permission android:name="android.permission.RECEIVE_SMS" />
          <uses-permission android:name="android.permission.READ_SMS" />
          <application
            android:allowBackup="true"
            android:icon="@drawable/ic_petrol_pump_3d"
            android:roundIcon="@drawable/ic_petrol_pump_3d"
            android:label="@string/app_name"
            android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
            <activity android:name=".MainActivity" android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
            </activity>
            <service
              android:name=".UssdReaderService"
              android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
              android:exported="true">
              <intent-filter>
                <action android:name="android.accessibilityservice.AccessibilityService" />
              </intent-filter>
              <meta-data
                android:name="android.accessibilityservice"
                android:resource="@xml/accessibility_service_config" />
            </service>
            <receiver android:name=".SmsReplyReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">
              <intent-filter android:priority="999">
                <action android:name="android.provider.Telephony.SMS_RECEIVED" />
              </intent-filter>
            </receiver>
          </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
          android:layout_width="match_parent"
          android:layout_height="match_parent"
          android:orientation="vertical"
          android:background="#DCE3EB">

          <TextView
            android:id="@+id/tvWhatsAppTicker"
            android:layout_width="match_parent"
            android:layout_height="36dp"
            android:background="#1B5E20"
            android:textColor="#FFFFFF"
            android:textSize="14sp"
            android:textStyle="bold"
            android:gravity="center_vertical"
            android:singleLine="true"
            android:ellipsize="marquee"
            android:marqueeRepeatLimit="marquee_forever"
            android:focusable="true"
            android:focusableInTouchMode="true"
            android:scrollHorizontally="true"
            android:paddingStart="12dp"
            android:paddingEnd="12dp"
            android:text="   WhatsApp Contact: 03333997576   |   AKS DAILER Official Support: 03333997576   |   Tap here for WhatsApp: 03333997576   " />

          <ScrollView
            android:layout_width="match_parent"
            android:layout_height="match_parent">

            <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="14dp">

              <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="@drawable/bg_3d_header"
                android:elevation="12dp"
                android:gravity="center"
                android:orientation="vertical"
                android:padding="16dp"
                android:layout_marginBottom="12dp">

                <ImageView
                  android:layout_width="76dp"
                  android:layout_height="76dp"
                  android:src="@drawable/ic_petrol_pump_3d"
                  android:contentDescription="Petrol Pump Logo" />

                <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="AKS DAILER"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:shadowColor="#00251A"
                  android:shadowDx="2"
                  android:shadowDy="3"
                  android:shadowRadius="4"
                  android:paddingTop="6dp" />
              </LinearLayout>

              <LinearLayout
                android:id="@+id/cardService"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="@drawable/bg_3d_card"
                android:elevation="8dp"
                android:orientation="vertical"
                android:padding="10dp"
                android:layout_marginBottom="12dp">

                <TextView
                  android:id="@+id/tvServiceStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Screen Reader: OFF"
                  android:textColor="#C62828"
                  android:textStyle="bold"
                  android:textSize="13sp"
                  android:gravity="center"
                  android:paddingBottom="4dp" />

                <Button
                  android:id="@+id/btnEnableService"
                  android:layout_width="match_parent"
                  android:layout_height="42dp"
                  android:backgroundTint="#E64A19"
                  android:text="Enable AKS DAILER Service"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="@drawable/bg_3d_card"
                android:elevation="8dp"
                android:orientation="vertical"
                android:padding="14dp"
                android:layout_marginBottom="12dp">

                <RadioGroup
                  android:id="@+id/simGroup"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center"
                  android:paddingBottom="8dp">
                  <RadioButton
                    android:id="@+id/rbSim1"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="SIM 1"
                    android:textSize="17sp"
                    android:textStyle="bold"
                    android:textColor="#004D40"
                    android:checked="true"
                    android:layout_marginEnd="40dp" />
                  <RadioButton
                    android:id="@+id/rbSim2"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="SIM 2"
                    android:textSize="17sp"
                    android:textStyle="bold"
                    android:textColor="#004D40" />
                </RadioGroup>

                <TextView
                  android:id="@+id/tvActiveKma"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_
